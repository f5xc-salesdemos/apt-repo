name: Update APT Repository

on:
  repository_dispatch:
    types: [xcsh-release, oh-my-xcsh-release]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to update"
        required: true
        type: choice
        options:
          - xcsh
          - oh-my-xcsh
      version:
        description: "Version (e.g., 1.3.13-f5xc.1)"
        required: true
      tag:
        description: "Release tag (e.g., v1.3.13-f5xc.1)"
        required: true

concurrency:
  group: apt-repository-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read # default token scope for release asset downloads

jobs:
  update-repo:
    name: Publish APT repository
    runs-on: managed-socketless
    environment: apt-repository-publish
    permissions:
      contents: write # commit the generated package repository to gh-pages
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: false

      - name: Set variables
        id: vars
        env:
          # On repository_dispatch every client_payload field is supplied by the
          # caller, so interpolating these into the run body let them expand into
          # executable shell before bash parsed the script. workflow_dispatch inputs
          # are free text too. All of them come in as env and are read as quoted
          # shell variables, which keeps them inert data.
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            version="$PAYLOAD_VERSION"
            tag="$PAYLOAD_TAG"
            case "$EVENT_ACTION" in
              xcsh-release) package="xcsh" ;;
              oh-my-xcsh-release) package="oh-my-xcsh" ;;
              *)
                echo "::error::unrecognised dispatch type '${EVENT_ACTION}'"
                exit 1
                ;;
            esac
          else
            version="$INPUT_VERSION"
            tag="$INPUT_TAG"
            package="$INPUT_PACKAGE"
          fi

          # One grouped redirect rather than six (shellcheck SC2129).
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "package=${package}"
          } >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.vars.outputs.package }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p assets
          repo="f5-sales-demo/${PACKAGE}"

          if [ "$PACKAGE" = "xcsh" ]; then
            gh release download "$TAG" --repo "$repo" \
              --pattern "xcsh-linux-x64.tar.gz" \
              --pattern "xcsh-linux-arm64.tar.gz" \
              --dir ./assets
          elif [ "$PACKAGE" = "oh-my-xcsh" ]; then
            gh release download "$TAG" --repo "$repo" \
              --pattern "oh-my-xcsh-linux-x64.tar.gz" \
              --pattern "oh-my-xcsh-linux-arm64.tar.gz" \
              --dir ./assets
          fi

      - name: Build .deb packages
        env:
          PACKAGE: ${{ steps.vars.outputs.package }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          chmod +x scripts/build-deb.sh

          if [ "$PACKAGE" = "xcsh" ]; then
            bash scripts/build-deb.sh xcsh "$VERSION" amd64 ./assets/xcsh-linux-x64.tar.gz
            bash scripts/build-deb.sh xcsh "$VERSION" arm64 ./assets/xcsh-linux-arm64.tar.gz
          elif [ "$PACKAGE" = "oh-my-xcsh" ]; then
            bash scripts/build-deb.sh oh-my-xcsh "$VERSION" amd64 ./assets/oh-my-xcsh-linux-x64.tar.gz
            bash scripts/build-deb.sh oh-my-xcsh "$VERSION" arm64 ./assets/oh-my-xcsh-linux-arm64.tar.gz
          fi

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Remove old packages for this package only
        env:
          PACKAGE: ${{ steps.vars.outputs.package }}
        run: |
          letter="${PACKAGE:0:1}"
          rm -f gh-pages/pool/main/"${letter}"/"${PACKAGE}"/*.deb

      - name: Copy new packages to pool
        env:
          PACKAGE: ${{ steps.vars.outputs.package }}
        run: |
          letter="${PACKAGE:0:1}"
          mkdir -p "gh-pages/pool/main/${letter}/${PACKAGE}/"
          cp output/*.deb "gh-pages/pool/main/${letter}/${PACKAGE}/"

      - name: Generate APT repository metadata
        run: |
          chmod +x scripts/update-apt-repo.sh
          bash scripts/update-apt-repo.sh gh-pages

      - name: Export GPG public key
        run: gpg --armor --export > gh-pages/gpg.key

      - name: Commit and push to gh-pages
        working-directory: gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.vars.outputs.package }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update ${PACKAGE} to ${TAG}"
          gh auth setup-git
          git push
